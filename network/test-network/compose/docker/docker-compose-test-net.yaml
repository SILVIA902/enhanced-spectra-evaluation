version: '3.7'

services:
  peer0.farmers.example.com:
    container_name: peer0.farmers.example.com
    image: hyperledger/fabric-peer:2.5.10
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_SERVERHOSTOVERRIDE=peer0.farmers.example.com
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_ID=peer0.farmers.example.com
      - CORE_PEER_ADDRESS=peer0.farmers.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farmers.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farmers.example.com:7051
      - CORE_PEER_LOCALMSPID=FarmersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.farmers.example.com:9444
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ../organizations/peerOrganizations/farmers.example.com/tlsca:/etc/hyperledger/fabric/tlsca
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/farmers.example.com/peers/peer0.farmers.example.com:/etc/hyperledger/fabric
      - peer0.farmers.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    networks:
      - fabric_test

  peer0.producers.example.com:
    container_name: peer0.producers.example.com
    image: hyperledger/fabric-peer:2.5.10
    labels:
      service: hyperledger-fabric
    environment:
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_SERVERHOSTOVERRIDE=peer0.producers.example.com
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_ID=peer0.producers.example.com
      - CORE_PEER_ADDRESS=peer0.producers.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.producers.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.producers.example.com:9051
      - CORE_PEER_LOCALMSPID=ProducersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.producers.example.com:9445
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ../organizations/peerOrganizations/producers.example.com/tlsca:/etc/hyperledger/fabric/tlsca
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/producers.example.com/peers/peer0.producers.example.com:/etc/hyperledger/fabric
      - peer0.producers.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 9051:9051
      - 9445:9445
    networks:
      - fabric_test

networks:
  fabric_test:
    driver: bridge
